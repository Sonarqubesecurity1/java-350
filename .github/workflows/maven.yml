name: Java CI with Maven and SonarCloud

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupération du code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Important pour SonarCloud
    
    # 2. Configuration Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    # 3. Build et tests (EXERCICE 1)
    - name: Build with Maven
      run: mvn clean verify -B
    
    # 4. SONARCLOUD (EXERCICE 2) - VERSION SIMPLIFIÉE
    - name: SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=Sonarqubesecurity1 \        
          -Dsonar.projectKey=Sonarqubesecurity1_java-350 \ 
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
