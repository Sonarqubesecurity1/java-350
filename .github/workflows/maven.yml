name: Java CI with Maven and SonarCloud

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Récupération du code
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    #  Configuration Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Build Maven + tests (mode debug pour diagnostiquer si besoin)
    - name: Build with Maven
      run: mvn clean verify -B -X

    # SonarCloud Scan
    - name: SonarCloud Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn sonar:sonar \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.organization=sonarqubesecurity1 \
          -Dsonar.login=${SONAR_TOKEN} \
          -Dsonar.projectKey=com.ipiecoles.java:java350
